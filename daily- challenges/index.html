<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="To-Do" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <div class="filters" id="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <footer>
      <span id="items-left">0 items-left</span>
      <button type="button" id="clear-completed">Clear Completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
