<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="todo-app">
      <h1>My To-Do List</h1>

      <form id="todo-form">
        <label for="todo-input" class="visually-hidden">New task</label>
        <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      <ul id="todo-list"></ul>

      <footer class="todo-footer">
        <span id="items-left" aria-live="polite">0 items left</span>
        <div class="filters">
          <button type="button" class="filter active" data-filter="all">All</button>
          <button type="button" class="filter" data-filter="active">Active</button>
          <button type="button" class="filter" data-filter="completed">Completed</button>
        </div>
        <button type="button" id="clear-completed">Clear Completed</button>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
